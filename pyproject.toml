[project]
name = "llm-ctf-bench"
version = "0.1.0"
description = "Reproducible evaluation of LLM agents on public CTF tasks inside network-isolated Docker sandboxes."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "docker>=7.1",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.38", "pandas>=2.2"]
dev = ["pytest>=8.3", "ruff>=0.6", "mypy>=1.11", "types-PyYAML", "types-docker"]
ops = ["ansible-core>=2.17", "ansible-lint>=24.0"]

[project.scripts]
ctfbench = "ctfbench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ctfbench"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["docker.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["docker: needs a running Docker daemon and the sandbox image"]
